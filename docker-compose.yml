services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: kanbanx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanbanx_dev}
      POSTGRES_DB: kanbanx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbanx -d kanbanx"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
